name: Deploy to EC2

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: app

        steps:
            - uses: actions/checkout@v5

            - name: Set up Python 3.11
              uses: actions/setup-python@v6
              with:
                  python-version: "3.11"

            - name: Install dependencies
              working-directory: app
              run: |
                  pip install -r requirements.txt
                  pip install flake8 bandit pytest-cov

            - name: flake8 Lint
              working-directory: app
              run: |
                  flake8 . --exclude=venv,.venv

            - name: Security scan
              working-directory: app
              run: |
                  bandit -r . -x ./tests

            - name: Run tests with coverage
              working-directory: app
              run: |
                  pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=80

            - name: Deploy over SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
                  script: |
                      sudo -u appuser bash -c "cd /home/appuser/app && git pull origin main && /home/appuser/app/venv/bin/pip install -r /home/appuser/app/app/requirements.txt"
                      sudo systemctl restart flask-app
                      sudo systemctl status flask-app --no-pager
            - name: Health check
              run: |
                  sleep 5
                  curl -f http://${{ secrets.EC2_HOST }}:5000/health
                  ## if
